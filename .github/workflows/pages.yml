name: GitHub Pages (docs and demo)

# Builds and deploys every site GitHub Pages serves for this repo, as one
# artifact assembled in _site/, on every push to `main` (and on demand via
# workflow_dispatch). Each site owns one path under
# https://nibblebot.github.io/omp-web/, so more can be added beside them:
#
# - docs/: the Starlight documentation site under docs/
#   (`bun run build:docs`, docs/dist). Astro's site/base in
#   docs/astro.config.mjs must match this URL (site = https://nibblebot.github.io,
#   base = /omp-web/docs/).
# - demo/: the omp-web demo, the real App with fixture data
#   (`bun run build:demo`). The demo page uses relative asset URLs and answers
#   its fixture routes in the page, so it needs no base setting of its own.
# - the root: the files in .github/pages-root/ (today an index.html that
#   redirects to docs/).
#
# docs/ has no package.json of its own: Astro, Starlight, the demo bundler and
# both build scripts live in the root package.json/bun.lock, so the workflow
# installs and builds from the repository root.
#
# Pages must be enabled on the repo with Source = "GitHub Actions" (Settings →
# Pages); the deploy job then publishes whatever this workflow uploads. The
# `github-pages` environment must also allow deploys from `main`: if
# Settings → Environments → github-pages restricts deployment branches (the
# default automatic environment does not), a run triggered from `main` is
# rejected at the deploy job.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One in-flight deployment; cancel superseded branch runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build docs site
        run: bun run build:docs
      - name: Assemble the site
        run: |
          mkdir _site
          cp -R .github/pages-root/. _site/
          cp -R docs/dist _site/docs
          bun run build:demo _site/demo
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
