<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>omp web design system</title>
		<script>
			// Same pre-paint theme resolution as apps/web/index.html (same storage
			// key and system fallback); initTheme() re-applies it on boot.
			(function () {
				var THEME_KEY = "omp-web:theme";
				var BG = {
					dark: "#0f1115",
					light: "#f5f6f8",
					"catppuccin-mocha": "#1e1e2e",
					"catppuccin-latte": "#eff1f5",
					"omp-dark": "oklch(13.5% 0.018 295)",
					"omp-light": "oklch(94% 0.006 80)"
				};
				var pref = null;
				try {
					pref = localStorage.getItem(THEME_KEY);
				} catch (e) {
					// storage unavailable: fall through to the system default
				}
				var theme = BG[pref]
					? pref
					: window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
						? "light"
						: "dark";
				document.documentElement.dataset.theme = theme;
				document.documentElement.style.background = BG[theme];
			})();
		</script>
		<link rel="stylesheet" href="/main.css" />
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/main.js"></script>
	</body>
</html>
