<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
		<title>omp web</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<!-- The boot shell stays hidden until the global stylesheet shows it (app.css, .app.boot-shell).
		     A build links that stylesheet in <head>, so the shell paints styled at once; the dev server
		     injects it from the entry chunk, so without this the shell would paint unstyled first. -->
		<style>
			.boot-shell {
				visibility: hidden;
			}
		</style>
	</head>
	<body>
		<script>
			// Pre-paint theme, so users of a non-default theme or the light scheme
			// don't flash the default. Reads the keys prefs/theme.ts writes (mode,
			// the per-scheme theme ids, and the cached CSS and background of the
			// selected variants), sets the root attributes and installs the cached
			// CSS as <style id="omp-themes">; prefs/theme.ts replaces that element
			// once /ctl/themes answers. It lives in <body> on purpose: it must run
			// after the global stylesheet's <link> (Vite appends it to <head>) so
			// the style element can follow it in document order, which decides
			// equal-specificity ties with tokens.css. Dependency-free on purpose.
			(function () {
				var DEFAULT_ID = "catppuccin";
				var FALLBACK_BG = { dark: "#1e1e2e", light: "#eff1f5" };
				function get(name) {
					try {
						return localStorage.getItem("omp-web:theme-" + name);
					} catch (e) {
						return null; // storage unavailable: defaults
					}
				}
				var mode = get("mode");
				var scheme =
					mode === "light" || mode === "dark"
						? mode
						: window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
							? "light"
							: "dark";
				var id = get(scheme);
				if (!id || !/^[a-z0-9-]+$/.test(id)) id = DEFAULT_ID;
				var css = get("css");
				var selector = function (themeId) {
					return '[data-theme-variant="' + themeId + "/" + scheme + '"]';
				};
				// A stored theme the cached CSS lacks (deleted file) renders the default.
				if (css && css.indexOf(selector(id)) === -1) id = DEFAULT_ID;
				var root = document.documentElement;
				root.dataset.scheme = scheme;
				root.dataset.themeVariant = id + "/" + scheme;
				var bg = get("bg");
				if (css) {
					var style = document.createElement("style");
					style.id = "omp-themes";
					style.textContent = css;
					document.head.appendChild(style);
					// The cached bg belongs to the variant applied last time; the OS scheme may have flipped since.
					var at = css.indexOf(selector(id));
					var rule = at === -1 ? "" : css.slice(at, css.indexOf("}", at));
					if (bg && rule.indexOf("--bg:" + bg + ";") === -1) bg = null;
				}
				root.style.background = bg || FALLBACK_BG[scheme];
				// The boot shell below shows the docked sidebar unless the user collapsed it (state.ts, SIDEBAR_KEY).
				try {
					if (localStorage.getItem("omp.sidebarVisible") === "false") root.dataset.bootSidebar = "closed";
				} catch (e) {
					// storage unavailable: shell shows the sidebar
				}
			})();
		</script>
		<!-- Boot shell: painted as soon as the stylesheet arrives, before the entry
		     chunk runs. index.tsx clears #root right before the app renders, so
		     nothing here needs cleanup. Classes come from the global stylesheet;
		     mirrors the docked sidebar and the main header (app.css, .boot-shell). -->
		<div id="root">
			<div class="app boot-shell" role="status" aria-label="Loading omp web">
				<div class="app-body">
					<aside class="sidebar open">
						<div class="sidebar-panel">
							<div class="sidebar-header">
								<span class="sidebar-wordmark">
									<svg class="icon" width="18" height="18" viewBox="0 0 64 64" aria-hidden="true">
										<defs>
											<clipPath id="omp-boot-logo-clip"><rect width="64" height="64" rx="14" /></clipPath>
										</defs>
										<rect class="omp-web-logo-tile" width="64" height="64" rx="14" />
										<g clip-path="url(#omp-boot-logo-clip)">
											<circle cx="14" cy="16" r="7.5" fill="#f2b84b" />
											<path class="omp-web-logo-base" transform="translate(-8 21)" d="M-4 44C12 44 20 33 24 25C30 11 44 4 54 12C63 20 58 35 42 38C52 33 54 27 49 23C43 18 36 23 33 32C29 43 20 53 -4 59Z" />
											<path transform="translate(-4 10.5)" fill="#ec8a2f" d="M-4 44C12 44 20 33 24 25C30 11 44 4 54 12C63 20 58 35 42 38C52 33 54 27 49 23C43 18 36 23 33 32C29 43 20 53 -4 59Z" />
											<path fill="#c4552d" d="M-4 44C12 44 20 33 24 25C30 11 44 4 54 12C63 20 58 35 42 38C52 33 54 27 49 23C43 18 36 23 33 32C29 43 20 53 -4 59Z" />
										</g>
									</svg>
									<span class="sidebar-wordmark-text">omp-web</span>
								</span>
							</div>
							<div class="sidebar-list boot-shell-rows">
								<span class="chat-skeleton-line"></span>
								<span class="chat-skeleton-line chat-skeleton-line--medium"></span>
								<span class="chat-skeleton-line"></span>
								<span class="chat-skeleton-line chat-skeleton-line--short"></span>
							</div>
						</div>
					</aside>
					<div class="main-pane">
						<header class="main-header"></header>
						<main class="app-main boot-shell-rows">
							<span class="chat-skeleton-line chat-skeleton-line--medium"></span>
							<span class="chat-skeleton-line"></span>
							<span class="chat-skeleton-line chat-skeleton-line--short"></span>
						</main>
					</div>
				</div>
			</div>
		</div>
		<script type="module" src="/index.tsx"></script>
	</body>
</html>
