<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 344" width="940" height="344" role="img" aria-labelledby="arch-title arch-desc" font-family='"Noto Sans", system-ui, sans-serif'>
	<title id="arch-title">omp-web architecture</title>
	<desc id="arch-desc">A browser on a desktop or phone talks to omp-web over one WebSocket. omp sessions, one per worktree, dial out to omp-web.</desc>
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
			<path d="M1 1.5L8.5 5L1 8.5z" fill="#575a6e" stroke="#575a6e" stroke-width="1" stroke-linejoin="round"/>
		</marker>
	</defs>

	<g font-size="13.5" font-weight="600" letter-spacing="0.4" fill="#575a6e">
		<text x="4" y="24">ANY DEVICE</text>
		<text x="344" y="24">ONE SERVER</text>
		<text x="704" y="24">ONE PER WORKTREE</text>
	</g>

	<!-- Browser -->
	<rect x="4" y="90" width="190" height="200" rx="14" fill="#eff1f5" stroke="#ccd0da" stroke-width="1.5"/>
	<g stroke="#9ca0b0" stroke-width="1.5" fill="#ffffff">
		<rect x="20" y="114" width="112" height="72" rx="7"/>
		<rect x="146" y="106" width="30" height="80" rx="7"/>
	</g>
	<g fill="#9ca0b0" stroke="none">
		<circle cx="30" cy="124" r="2.4"/>
		<circle cx="38" cy="124" r="2.4"/>
		<circle cx="46" cy="124" r="2.4"/>
		<rect x="28" y="136" width="22" height="42" rx="3" opacity="0.35"/>
		<rect x="58" y="138" width="62" height="6" rx="3" opacity="0.35"/>
		<rect x="58" y="152" width="48" height="6" rx="3" opacity="0.35"/>
		<rect x="58" y="166" width="56" height="6" rx="3" opacity="0.35"/>
		<rect x="153" y="114" width="16" height="5" rx="2.5" opacity="0.6"/>
		<rect x="153" y="128" width="16" height="6" rx="3" opacity="0.35"/>
		<rect x="153" y="142" width="16" height="6" rx="3" opacity="0.35"/>
		<rect x="153" y="156" width="16" height="6" rx="3" opacity="0.35"/>
	</g>
	<text x="99" y="236" text-anchor="middle" font-size="22" font-weight="700" fill="#4c4f69">Browser</text>
	<text x="99" y="262" text-anchor="middle" font-size="14.5" fill="#575a6e">desktop or phone</text>

	<!-- Browser to omp-web: one WebSocket, both directions -->
	<path d="M202 190H336" fill="none" stroke="#575a6e" stroke-width="2" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
	<text x="269" y="178" text-anchor="middle" font-size="14.5" fill="#575a6e">one WebSocket</text>

	<!-- omp-web -->
	<rect x="344" y="90" width="190" height="200" rx="14" fill="#1a55d6" fill-opacity="0.14" stroke="#1a55d6" stroke-width="2.5"/>
	<text x="439" y="142" text-anchor="middle" font-size="26" font-weight="700" fill="#1a55d6">omp-web</text>
	<g font-size="16" fill="#4c4f69">
		<circle cx="374" cy="179" r="3.5" fill="#1a55d6"/>
		<text x="388" y="184">Projects</text>
		<circle cx="374" cy="209" r="3.5" fill="#1a55d6"/>
		<text x="388" y="214">Lifecycle</text>
		<circle cx="374" cy="239" r="3.5" fill="#1a55d6"/>
		<text x="388" y="244">Serves the UI</text>
	</g>

	<!-- Sessions dial out to omp-web -->
	<rect x="704" y="44" width="232" height="88" rx="12" fill="#eff1f5" stroke="#ccd0da" stroke-width="1.5"/>
	<text x="720" y="80" font-family='"Fira Code", ui-monospace, "DejaVu Sans Mono", monospace' font-size="15" font-weight="600" fill="#4c4f69">omp-web/main</text>
	<text x="720" y="106" font-size="13.5" fill="#575a6e">omp SDK · .jsonl transcript</text>
	<path d="M704 88H682" fill="none" stroke="#575a6e" stroke-width="2" stroke-linecap="round"/>
	<rect x="704" y="146" width="232" height="88" rx="12" fill="#eff1f5" stroke="#ccd0da" stroke-width="1.5"/>
	<text x="720" y="182" font-family='"Fira Code", ui-monospace, "DejaVu Sans Mono", monospace' font-size="15" font-weight="600" fill="#4c4f69">omp-web/fix-sidebar</text>
	<text x="720" y="208" font-size="13.5" fill="#575a6e">omp SDK · .jsonl transcript</text>
	<path d="M704 190H682" fill="none" stroke="#575a6e" stroke-width="2" stroke-linecap="round"/>
	<rect x="704" y="248" width="232" height="88" rx="12" fill="#eff1f5" stroke="#ccd0da" stroke-width="1.5"/>
	<text x="720" y="284" font-family='"Fira Code", ui-monospace, "DejaVu Sans Mono", monospace' font-size="15" font-weight="600" fill="#4c4f69">api/feature-x</text>
	<text x="720" y="310" font-size="13.5" fill="#575a6e">omp SDK · .jsonl transcript</text>
	<path d="M704 292H682" fill="none" stroke="#575a6e" stroke-width="2" stroke-linecap="round"/>
	<path d="M682 88V292" fill="none" stroke="#575a6e" stroke-width="2" stroke-linecap="round"/>
	<path d="M682 190H542" fill="none" stroke="#575a6e" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
	<text x="612" y="178" text-anchor="middle" font-size="14.5" fill="#575a6e">sessions dial out</text>
</svg>
