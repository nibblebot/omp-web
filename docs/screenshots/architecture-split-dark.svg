<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1336 344" width="1336" height="344" role="img" aria-labelledby="arch-title arch-desc" font-family='"Noto Sans", system-ui, sans-serif'>
	<title id="arch-title">omp-web architecture</title>
	<desc id="arch-desc">A browser on a desktop or phone talks over one WebSocket to omp-web ui, which serves the web UI. omp-web ui reaches omp-web control over loopback on the same host. omp sessions, one per worktree, dial out to omp-web control.</desc>
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
			<path d="M1 1.5L8.5 5L1 8.5z" fill="#a6adc8" stroke="#a6adc8" stroke-width="1" stroke-linejoin="round"/>
		</marker>
	</defs>

	<g font-size="13.5" font-weight="600" letter-spacing="0.4" fill="#a6adc8">
		<text x="4" y="24">ANY DEVICE</text>
		<text x="370" y="24">UI PROCESS</text>
		<text x="684" y="24">CONTROL PLANE</text>
		<text x="1100" y="24">ONE PER WORKTREE</text>
	</g>

	<!-- One host: both processes run on the same machine -->
	<rect x="352" y="62" width="560" height="262" rx="20" fill="none" stroke="#585b70" stroke-width="1.5" stroke-dasharray="7 6"/>
	<text x="632" y="312" text-anchor="middle" font-size="13.5" font-weight="600" letter-spacing="0.4" fill="#a6adc8">ONE HOST</text>

	<!-- Browser -->
	<rect x="4" y="90" width="190" height="200" rx="14" fill="#1e1e2e" stroke="#45475a" stroke-width="1.5"/>
	<g stroke="#585b70" stroke-width="1.5" fill="#313244">
		<rect x="20" y="114" width="112" height="72" rx="7"/>
		<rect x="146" y="106" width="30" height="80" rx="7"/>
	</g>
	<g fill="#585b70" stroke="none">
		<circle cx="30" cy="124" r="2.4"/>
		<circle cx="38" cy="124" r="2.4"/>
		<circle cx="46" cy="124" r="2.4"/>
		<rect x="28" y="136" width="22" height="42" rx="3" opacity="0.35"/>
		<rect x="58" y="138" width="62" height="6" rx="3" opacity="0.35"/>
		<rect x="58" y="152" width="48" height="6" rx="3" opacity="0.35"/>
		<rect x="58" y="166" width="56" height="6" rx="3" opacity="0.35"/>
		<rect x="153" y="114" width="16" height="5" rx="2.5" opacity="0.6"/>
		<rect x="153" y="128" width="16" height="6" rx="3" opacity="0.35"/>
		<rect x="153" y="142" width="16" height="6" rx="3" opacity="0.35"/>
		<rect x="153" y="156" width="16" height="6" rx="3" opacity="0.35"/>
	</g>
	<text x="99" y="236" text-anchor="middle" font-size="22" font-weight="700" fill="#cdd6f4">Browser</text>
	<text x="99" y="262" text-anchor="middle" font-size="14.5" fill="#a6adc8">desktop or phone</text>

	<!-- Browser to omp-web ui: one WebSocket, both directions -->
	<path d="M202 190H362" fill="none" stroke="#a6adc8" stroke-width="2" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
	<text x="282" y="178" text-anchor="middle" font-size="14.5" fill="#a6adc8">one WebSocket</text>

	<!-- omp-web ui -->
	<rect x="370" y="90" width="210" height="200" rx="14" fill="#89b4fa" fill-opacity="0.14" stroke="#89b4fa" stroke-width="2.5"/>
	<text x="475" y="146" text-anchor="middle" font-family='"Fira Code", ui-monospace, "DejaVu Sans Mono", monospace' font-size="20" font-weight="700" fill="#89b4fa">omp-web ui</text>
	<text x="475" y="170" text-anchor="middle" font-family='"Fira Code", ui-monospace, "DejaVu Sans Mono", monospace' font-size="14.5" fill="#a6adc8">default port 4723</text>
	<g font-size="16" fill="#cdd6f4">
		<circle cx="400" cy="212" r="3.5" fill="#89b4fa"/>
		<text x="414" y="217">Serves the UI</text>
		<circle cx="400" cy="242" r="3.5" fill="#89b4fa"/>
		<text x="414" y="247">Proxies API and /ws</text>
	</g>

	<!-- omp-web ui to omp-web control, loopback -->
	<path d="M588 190H676" fill="none" stroke="#a6adc8" stroke-width="2" stroke-linecap="round" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
	<text x="632" y="178" text-anchor="middle" font-size="14.5" fill="#a6adc8">loopback</text>

	<!-- omp-web control -->
	<rect x="684" y="90" width="210" height="200" rx="14" fill="#89b4fa" fill-opacity="0.14" stroke="#89b4fa" stroke-width="2.5"/>
	<text x="789" y="146" text-anchor="middle" font-family='"Fira Code", ui-monospace, "DejaVu Sans Mono", monospace' font-size="20" font-weight="700" fill="#89b4fa">omp-web control</text>
	<text x="789" y="170" text-anchor="middle" font-family='"Fira Code", ui-monospace, "DejaVu Sans Mono", monospace' font-size="14.5" fill="#a6adc8">default port 4722</text>
	<g font-size="16" fill="#cdd6f4">
		<circle cx="714" cy="212" r="3.5" fill="#89b4fa"/>
		<text x="728" y="217">Projects</text>
		<circle cx="714" cy="242" r="3.5" fill="#89b4fa"/>
		<text x="728" y="247">Lifecycle</text>
	</g>

	<!-- Sessions dial out to omp-web control -->
	<rect x="1100" y="44" width="232" height="88" rx="12" fill="#1e1e2e" stroke="#45475a" stroke-width="1.5"/>
	<text x="1116" y="80" font-family='"Fira Code", ui-monospace, "DejaVu Sans Mono", monospace' font-size="15" font-weight="600" fill="#cdd6f4">omp-web/main</text>
	<text x="1116" y="106" font-size="13.5" fill="#a6adc8">omp SDK · .jsonl transcript</text>
	<path d="M1100 88H1078" fill="none" stroke="#a6adc8" stroke-width="2" stroke-linecap="round"/>
	<rect x="1100" y="146" width="232" height="88" rx="12" fill="#1e1e2e" stroke="#45475a" stroke-width="1.5"/>
	<text x="1116" y="182" font-family='"Fira Code", ui-monospace, "DejaVu Sans Mono", monospace' font-size="15" font-weight="600" fill="#cdd6f4">omp-web/fix-sidebar</text>
	<text x="1116" y="208" font-size="13.5" fill="#a6adc8">omp SDK · .jsonl transcript</text>
	<path d="M1100 190H1078" fill="none" stroke="#a6adc8" stroke-width="2" stroke-linecap="round"/>
	<rect x="1100" y="248" width="232" height="88" rx="12" fill="#1e1e2e" stroke="#45475a" stroke-width="1.5"/>
	<text x="1116" y="284" font-family='"Fira Code", ui-monospace, "DejaVu Sans Mono", monospace' font-size="15" font-weight="600" fill="#cdd6f4">api/feature-x</text>
	<text x="1116" y="310" font-size="13.5" fill="#a6adc8">omp SDK · .jsonl transcript</text>
	<path d="M1100 292H1078" fill="none" stroke="#a6adc8" stroke-width="2" stroke-linecap="round"/>
	<path d="M1078 88V292" fill="none" stroke="#a6adc8" stroke-width="2" stroke-linecap="round"/>
	<path d="M1078 190H902" fill="none" stroke="#a6adc8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
	<text x="990" y="178" text-anchor="middle" font-size="14.5" fill="#a6adc8">sessions dial out</text>
</svg>
